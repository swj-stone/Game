<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>中国象棋 - Chinese Chess</title>
<style>
  :root {
    --board-size: min(90vw, 90vh - 120px, 540px);
    --cell: calc(var(--board-size) / 9);
    --piece-size: calc(var(--cell) * 0.85);
    --red: #c0392b;
    --red-light: #e74c3c;
    --black: #1a1a2e;
    --hint-safe: rgba(72, 199, 142, 0.7);
    --hint-attack: rgba(231, 76, 60, 0.75);
    --hint-attack-ring: rgba(231, 76, 60, 0.9);
    --gold: #d4a017;
    --font-cn: 'Noto Serif SC','SimSun','STSong','KaiTi','楷体',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:linear-gradient(135deg,#2c1810 0%,#3e2723 30%,#4e342e 60%,#2c1810 100%);
    min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-cn);
    overflow:hidden;user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  #app{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:600px;padding:8px}
  #turn-bar{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,0.5);border-radius:30px;padding:8px 24px;border:2px solid rgba(255,255,255,0.15);backdrop-filter:blur(8px);transition:all 0.3s}
  #turn-dot{width:20px;height:20px;border-radius:50%;transition:background 0.3s;box-shadow:0 0 12px currentColor}
  #turn-dot.red{background:var(--red-light);color:var(--red-light)}
  #turn-dot.black{background:var(--black);color:#888}
  #turn-label{color:#fff;font-size:1.1rem;font-weight:bold;letter-spacing:2px}
  #board-wrapper{position:relative;width:var(--board-size);height:calc(var(--board-size)*10/9);border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.5),0 0 0 4px rgba(139,90,43,0.6),0 0 0 8px rgba(101,67,33,0.4);overflow:hidden}
  #board-canvas{position:absolute;inset:0;width:100%;height:100%}
  #pieces-layer{position:absolute;inset:0;pointer-events:none}
  #pieces-layer>*{pointer-events:auto}
  #hints-layer{position:absolute;inset:0;pointer-events:none}
  .piece{position:absolute;width:var(--piece-size);height:var(--piece-size);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--piece-size)*0.48);font-weight:bold;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;transform:translate(-50%,-50%);line-height:1;text-shadow:0 1px 2px rgba(0,0,0,0.3)}
  .piece.red-piece{background:radial-gradient(circle at 35% 35%,#f5c6a0,#e8b88a 40%,#c07840 100%);color:var(--red);border:2.5px solid #8b4513;box-shadow:0 3px 8px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.3)}
  .piece.black-piece{background:radial-gradient(circle at 35% 35%,#c8d6e5,#a0b0c0 40%,#5a6a7a 100%);color:var(--black);border:2.5px solid #2d3436;box-shadow:0 3px 8px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.3)}
  .piece.selected{transform:translate(-50%,-50%) scale(1.12);z-index:10;box-shadow:0 0 20px rgba(255,215,0,0.7),0 3px 8px rgba(0,0,0,0.35)!important;border-color:#ffd700!important}
  .piece:active{transform:translate(-50%,-50%) scale(0.95)}
  .piece.selected:active{transform:translate(-50%,-50%) scale(1.05)}
  .hint{position:absolute;width:calc(var(--cell)*0.36);height:calc(var(--cell)*0.36);border-radius:50%;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;transition:transform 0.1s,opacity 0.15s;z-index:5}
  .hint.safe{background:var(--hint-safe);border:2px solid rgba(72,199,142,0.5)}
  .hint.attack{background:var(--hint-attack);border:2.5px solid var(--hint-attack-ring);box-shadow:0 0 12px rgba(231,76,60,0.5);animation:pulse-attack 0.8s ease-in-out infinite alternate}
  @keyframes pulse-attack{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.2)}}
  #capture-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:clamp(3rem,10vw,6rem);font-weight:900;color:#ff4444;text-shadow:0 0 20px rgba(255,0,0,0.6),0 4px 8px rgba(0,0,0,0.6);pointer-events:none;z-index:100;font-family:var(--font-cn)}
  #capture-toast.show{animation:toast-pop 0.9s ease-out forwards}
  @keyframes toast-pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-10deg);opacity:1}40%{transform:translate(-50%,-50%) scale(1.3) rotate(3deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1.5) rotate(0deg);opacity:0}}
  #check-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:clamp(2.5rem,8vw,5rem);font-weight:900;color:#ffd700;text-shadow:0 0 24px rgba(255,215,0,0.7),0 4px 8px rgba(0,0,0,0.6);pointer-events:none;z-index:99;font-family:var(--font-cn)}
  #check-toast.show{animation:check-pop 0.8s ease-out forwards}
  @keyframes check-pop{0%{transform:translate(-50%,-50%) scale(0.5);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1.4);opacity:0}}
  #victory-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity 0.4s;backdrop-filter:blur(4px)}
  #victory-overlay.show{opacity:1;pointer-events:auto}
  #victory-modal{background:linear-gradient(145deg,#3e2723,#4e342e);border:3px solid #d4a017;border-radius:20px;padding:32px 36px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.6);max-width:90vw;transform:scale(0.8);transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275)}
  #victory-overlay.show #victory-modal{transform:scale(1)}
  #victory-title{font-size:2.2rem;font-weight:900;margin-bottom:8px;font-family:var(--font-cn)}
  #victory-title.red-win{color:#e74c3c;text-shadow:0 0 20px rgba(231,76,60,0.5)}
  #victory-title.black-win{color:#a0b0c0;text-shadow:0 0 20px rgba(160,176,192,0.5)}
  #victory-subtitle{color:#ccc;font-size:1rem;margin-bottom:24px}
  .victory-btn{display:block;width:100%;padding:12px 24px;margin:8px 0;border:2px solid #d4a017;border-radius:12px;background:rgba(212,160,23,0.15);color:#ffd700;font-size:1.1rem;font-weight:bold;cursor:pointer;transition:all 0.2s;font-family:var(--font-cn)}
  .victory-btn:hover{background:rgba(212,160,23,0.3);transform:scale(1.03)}
  .victory-btn:active{transform:scale(0.97)}
  #replay-panel{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;z-index:300;opacity:0;pointer-events:none;transition:opacity 0.3s}
  #replay-panel.show{opacity:1;pointer-events:auto}
  #replay-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(0,0,0,0.6);border-bottom:1px solid rgba(255,255,255,0.1)}
  #replay-header h2{color:#ffd700;font-size:1.2rem;font-family:var(--font-cn)}
  #replay-close{background:none;border:2px solid rgba(255,255,255,0.3);color:#fff;width:36px;height:36px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #replay-moves{flex:1;overflow-y:auto;padding:16px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;max-height:40vh}
  .replay-move{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:6px 12px;color:#ddd;font-size:0.9rem;cursor:pointer;transition:all 0.15s;font-family:var(--font-cn)}
  .replay-move:hover{background:rgba(255,215,0,0.2);border-color:#ffd700}
  .replay-move.current{background:rgba(255,215,0,0.3);border-color:#ffd700;color:#ffd700}
  .replay-move.capture{color:#ff6b6b}
  #replay-controls{display:flex;gap:12px;justify-content:center;padding:16px;border-top:1px solid rgba(255,255,255,0.1)}
  #replay-controls button{padding:10px 20px;border-radius:10px;border:2px solid #d4a017;background:rgba(212,160,23,0.15);color:#ffd700;font-size:1rem;cursor:pointer;transition:all 0.2s;font-family:var(--font-cn)}
  #replay-controls button:hover{background:rgba(212,160,23,0.3)}
  #replay-controls button:disabled{opacity:0.3;cursor:default}
  #replay-board{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0}
  #replay-board-inner{position:relative;width:min(70vw,45vh,360px);height:calc(min(70vw,45vh,360px)*10/9)}
  #btn-new-game{padding:8px 20px;border-radius:20px;border:2px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.08);color:#ddd;font-size:0.9rem;cursor:pointer;transition:all 0.2s;font-family:var(--font-cn)}
  #btn-new-game:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.4)}
  .fire-ring{
    position:absolute;pointer-events:none;
    border-radius:50%;
    border:3px solid;
    border-color:#ff6600 #ffaa00 #ffdd00 #ff4400;
    box-shadow:0 0 10px #ff6600,0 0 20px #ff4400,inset 0 0 8px rgba(255,170,0,0.35);
    transform:translate(-50%,-50%);
    animation:ring-sway 2.5s ease-in-out infinite alternate;
  }
  @keyframes ring-sway{
    0%{transform:translate(-50%,-50%) rotate(0deg) scale(1)}
    25%{transform:translate(-50%,-53%) rotate(2deg) scale(1.04)}
    50%{transform:translate(-50%,-48%) rotate(-2deg) scale(0.97)}
    75%{transform:translate(-50%,-52%) rotate(-3deg) scale(1.03)}
    100%{transform:translate(-50%,-50%) rotate(1deg) scale(0.99)}
  }
  @media(max-width:600px){#app{gap:6px;padding:4px}#turn-bar{padding:6px 16px}#turn-label{font-size:0.95rem}.victory-btn{font-size:1rem;padding:10px 20px}#victory-title{font-size:1.6rem}}
</style>
</head>
<body>
<div id="app">
  <div id="turn-bar">
    <div id="turn-dot" class="red"></div>
    <span id="turn-label">红方走棋</span>
    <button id="btn-new-game" onclick="newGame()">新局</button>
  </div>
  <div id="board-wrapper">
    <canvas id="board-canvas"></canvas>
    <div id="hints-layer"></div>
    <div id="pieces-layer"></div>
  </div>
</div>
<div id="capture-toast">吃！</div>
<div id="check-toast">将军！</div>
<div id="victory-overlay">
  <div id="victory-modal">
    <div id="victory-title"></div>
    <div id="victory-subtitle"></div>
    <button class="victory-btn" onclick="newGame()">新的一局</button>
    <button class="victory-btn" onclick="openReplay()">复盘本局</button>
  </div>
</div>
<div id="replay-panel">
  <div id="replay-header">
    <h2>棋局复盘</h2>
    <button id="replay-close" onclick="closeReplay()">X</button>
  </div>
  <div id="replay-board"><div id="replay-board-inner"><canvas id="replay-canvas"></canvas></div></div>
  <div id="replay-moves"></div>
  <div id="replay-controls">
    <button onclick="replayStep(-1)" id="replay-prev">上一步</button>
    <button onclick="replayStep(1)" id="replay-next">下一步</button>
    <button onclick="replayGoto(0)" id="replay-start">开始</button>
    <button onclick="replayGoto(-1)" id="replay-end">结束</button>
  </div>
</div>
<script>
const RED='red',BLACK='black';
const KING='K',ADVISOR='A',ELEPHANT='E',HORSE='H',CHARIOT='R',CANNON='C',PAWN='P';
const PIECE_NAMES={red:{K:'帅',A:'仕',E:'相',H:'馬',R:'車',C:'炮',P:'兵'},black:{K:'将',A:'士',E:'象',H:'馬',R:'車',C:'砲',P:'卒'}};

let board=[],currentTurn=RED,selectedPos=null,legalMoves=[],moveHistory=[],gameOver=false,winner=null;
let replayStepIdx=-1,highlightedMoveIdx=-1,animating=false;

function createPiece(type,color){return{type,color};}

function initBoard(){
  board=Array.from({length:10},()=>Array(9).fill(null));
  const br=[CHARIOT,HORSE,ELEPHANT,ADVISOR,KING,ADVISOR,ELEPHANT,HORSE,CHARIOT];
  for(let c=0;c<9;c++)board[0][c]=createPiece(br[c],BLACK);
  board[2][1]=createPiece(CANNON,BLACK);board[2][7]=createPiece(CANNON,BLACK);
  for(let c=0;c<9;c+=2)board[3][c]=createPiece(PAWN,BLACK);
  for(let c=0;c<9;c+=2)board[6][c]=createPiece(PAWN,RED);
  board[7][1]=createPiece(CANNON,RED);board[7][7]=createPiece(CANNON,RED);
  for(let c=0;c<9;c++)board[9][c]=createPiece(br[c],RED);
}

function cloneBoard(b){return b.map(r=>r.map(c=>c?{...c}:null));}
function inBounds(r,c){return r>=0&&r<10&&c>=0&&c<9;}
function inPalace(r,c,color){return color===RED?r>=7&&r<=9&&c>=3&&c<=5:r>=0&&r<=2&&c>=3&&c<=5;}
function crossedRiver(r,color){return color===RED?r<=4:r>=5;}

function generateRawMoves(b,r,c){
  const piece=b[r][c];if(!piece)return[];
  const color=piece.color,moves=[];
  const addSingle=(dr,dc)=>{
    const nr=r+dr,nc=c+dc;
    if(inBounds(nr,nc)&&(!b[nr][nc]||b[nr][nc].color!==color))moves.push({row:nr,col:nc});
  };
  switch(piece.type){
    case KING:
      for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){
        const nr=r+dr,nc=c+dc;
        if(inPalace(nr,nc,color)&&(!b[nr][nc]||b[nr][nc].color!==color))moves.push({row:nr,col:nc});
      }
      {const oc=color===RED?BLACK:RED;let kr=-1,kc=-1;
      for(let rr=0;rr<10;rr++){for(let cc=0;cc<9;cc++)if(b[rr][cc]&&b[rr][cc].type===KING&&b[rr][cc].color===oc){kr=rr;kc=cc;break;}if(kr!==-1)break;}
      if(kc===c&&kr!==-1){let bl=false;const mn=Math.min(r,kr),mx=Math.max(r,kr);for(let rr=mn+1;rr<mx;rr++)if(b[rr][c]){bl=true;break;}if(!bl)moves.push({row:kr,col:kc});}}
      break;
    case ADVISOR:
      for(const[dr,dc]of[[-1,-1],[-1,1],[1,-1],[1,1]]){
        const nr=r+dr,nc=c+dc;
        if(inPalace(nr,nc,color)&&(!b[nr][nc]||b[nr][nc].color!==color))moves.push({row:nr,col:nc});
      }
      break;
    case ELEPHANT:
      for(const[tr,tc,er,ec]of[[-2,-2,-1,-1],[-2,2,-1,1],[2,-2,1,-1],[2,2,1,1]]){
        const nr=r+tr,nc=c+tc;if(!inBounds(nr,nc))continue;
        if(color===RED&&nr<5)continue;if(color===BLACK&&nr>4)continue;
        if(b[r+er][c+ec])continue;
        if(!b[nr][nc]||b[nr][nc].color!==color)moves.push({row:nr,col:nc});
      }
      break;
    case HORSE:
      for(const[lr,lc,tr,tc]of[[-1,0,-2,-1],[-1,0,-2,1],[1,0,2,-1],[1,0,2,1],[0,-1,-1,-2],[0,-1,1,-2],[0,1,-1,2],[0,1,1,2]]){
        if(b[r+lr]&&b[r+lr][c+lc])continue;
        const nr=r+tr,nc=c+tc;if(!inBounds(nr,nc))continue;
        if(!b[nr][nc]||b[nr][nc].color!==color)moves.push({row:nr,col:nc});
      }
      break;
    case CHARIOT:
      for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){
        for(let i=1;i<10;i++){
          const nr=r+dr*i,nc=c+dc*i;if(!inBounds(nr,nc))break;
          const t=b[nr][nc];if(t){if(t.color!==color)moves.push({row:nr,col:nc});break;}
          moves.push({row:nr,col:nc});
        }
      }
      break;
    case CANNON:
      for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){
        for(let i=1;i<10;i++){
          const nr=r+dr*i,nc=c+dc*i;if(!inBounds(nr,nc))break;
          if(b[nr][nc])break;moves.push({row:nr,col:nc});
        }
      }
      for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){
        let screen=false;
        for(let i=1;i<10;i++){
          const nr=r+dr*i,nc=c+dc*i;if(!inBounds(nr,nc))break;
          if(!screen){if(b[nr][nc])screen=true;}
          else{if(b[nr][nc]){if(b[nr][nc].color!==color)moves.push({row:nr,col:nc});break;}}
        }
      }
      break;
    case PAWN:
      const fwd=color===RED?-1:1;addSingle(fwd,0);
      if(crossedRiver(r,color)){addSingle(0,-1);addSingle(0,1);}
      break;
  }
  return moves;
}

function kingsAreFacing(b){
  let rk=null,bk=null;
  for(let r=0;r<10;r++)for(let c=0;c<9;c++)if(b[r][c]&&b[r][c].type===KING){
    if(b[r][c].color===RED)rk={r,c};else bk={r,c};
  }
  if(!rk||!bk)return false;if(rk.c!==bk.c)return false;
  const mn=Math.min(rk.r,bk.r),mx=Math.max(rk.r,bk.r);
  for(let r=mn+1;r<mx;r++)if(b[r][rk.c])return false;
  return true;
}

function isInCheck(b,color){
  let kr=-1,kc=-1;
  for(let r=0;r<10;r++){for(let c=0;c<9;c++)if(b[r][c]&&b[r][c].type===KING&&b[r][c].color===color){kr=r;kc=c;break;}if(kr!==-1)break;}
  if(kr===-1)return true;
  const opp=color===RED?BLACK:RED;
  for(let r=0;r<10;r++)for(let c=0;c<9;c++)if(b[r][c]&&b[r][c].color===opp){
    const ms=generateRawMoves(b,r,c);if(ms.some(m=>m.row===kr&&m.col===kc))return true;
  }
  return false;
}

function getLegalMoves(r,c){const piece=board[r][c];if(!piece)return[];return generateRawMoves(board,r,c).map(move=>({...move,isCapture:board[move.row][move.col]!==null}));}

function hasLegalMoves(color){
  for(let r=0;r<10;r++)for(let c=0;c<9;c++)if(board[r][c]&&board[r][c].color===color)if(getLegalMoves(r,c).length>0)return true;
  return false;
}

function executeMove(fr,fc,tr,tc){
  const piece=board[fr][fc],captured=board[tr][tc];
  moveHistory.push({from:{row:fr,col:fc},to:{row:tr,col:tc},piece:{type:piece.type,color:piece.color},captured:captured?{type:captured.type,color:captured.color}:null,turn:currentTurn});
  board[tr][tc]=board[fr][fc];board[fr][fc]=null;
  const wasCapture=!!captured;
  const opponent=currentTurn===RED?BLACK:RED;
  if(captured&&captured.type===KING){gameOver=true;winner=currentTurn;}
  else if(!hasLegalMoves(opponent)){gameOver=true;winner=currentTurn;}
  currentTurn=opponent;return wasCapture;
}
const boardCanvas=document.getElementById('board-canvas');
const boardCtx=boardCanvas.getContext('2d');
const piecesLayer=document.getElementById('pieces-layer');
const hintsLayer=document.getElementById('hints-layer');
const replayCanvas=document.getElementById('replay-canvas');
const replayCtx=replayCanvas.getContext('2d');

function getBoardMetrics(){
  const w=document.getElementById('board-wrapper').clientWidth;
  const cell=w/9;return{w,h:w*10/9,cell,pad:cell*0.5};
}

function drawBoard(canvas,ctx){
  const parent=canvas.parentElement;
  const w=parent.clientWidth,h=parent.clientHeight;
  canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.setTransform(1,0,0,1,0,0);ctx.scale(devicePixelRatio,devicePixelRatio);
  const cell=w/9,pad=cell*0.5,lw=Math.max(1,cell*0.025);
  ctx.fillStyle='#e8d5a3';ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#5d4037';ctx.lineWidth=lw;
  for(let r=0;r<10;r++){const y=pad+r*cell;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(pad+8*cell,y);ctx.stroke();}
  for(let c=0;c<9;c++){
    const x=pad+c*cell;
    ctx.beginPath();ctx.moveTo(x,pad);ctx.lineTo(x,pad+4*cell);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,pad+5*cell);ctx.lineTo(x,pad+9*cell);ctx.stroke();
  }
  ctx.beginPath();ctx.moveTo(pad,pad);ctx.lineTo(pad,pad+9*cell);ctx.stroke();
  ctx.beginPath();ctx.moveTo(pad+8*cell,pad);ctx.lineTo(pad+8*cell,pad+9*cell);ctx.stroke();
  ctx.lineWidth=lw*0.7;
  const pals=[[pad+3*cell,pad,pad+5*cell,pad+2*cell],[pad+3*cell,pad+2*cell,pad+5*cell,pad],[pad+3*cell,pad+7*cell,pad+5*cell,pad+9*cell],[pad+3*cell,pad+9*cell,pad+5*cell,pad+7*cell]];
  for(const[x1,y1,x2,y2]of pals){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
  ctx.fillStyle='#5d4037';ctx.font=cell*0.55+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('楚  河',pad+2*cell,pad+4.5*cell);
  ctx.fillText('汉  界',pad+6*cell,pad+4.5*cell);
}

function xyForPos(row,col){const{cell,pad}=getBoardMetrics();return{x:pad+col*cell,y:pad+row*cell};}

function renderPieces(){
  piecesLayer.innerHTML='';
  for(let r=0;r<10;r++)for(let c=0;c<9;c++){
    const piece=board[r][c];if(!piece)continue;
    const{x,y}=xyForPos(r,c);
    const el=document.createElement('div');
    el.className='piece '+piece.color+'-piece';
    el.textContent=PIECE_NAMES[piece.color][piece.type];
    el.style.left=x+'px';el.style.top=y+'px';
    if(selectedPos&&selectedPos.row===r&&selectedPos.col===c)el.classList.add('selected');
    ((rr,cc)=>{el.addEventListener('click',e=>{e.stopPropagation();handlePieceClick(rr,cc);});el.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();handlePieceClick(rr,cc);});})(r,c);
    piecesLayer.appendChild(el);
  }
}

function renderHints(){
  hintsLayer.innerHTML='';
  if(!selectedPos||gameOver)return;
  for(const move of legalMoves){
    const{x,y}=xyForPos(move.row,move.col);
    const hint=document.createElement('div');
    hint.className='hint '+(move.isCapture?'attack':'safe');
    hint.style.left=x+'px';hint.style.top=y+'px';
    ((rr,cc)=>{hint.addEventListener('click',e=>{e.stopPropagation();handleHintClick(rr,cc);});hint.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();handleHintClick(rr,cc);});})(move.row,move.col);
    hintsLayer.appendChild(hint);
  }
}

function renderAll(){drawBoard(boardCanvas,boardCtx);renderPieces();renderHints();updateTurnUI();}

function updateTurnUI(){
  const dot=document.getElementById('turn-dot'),label=document.getElementById('turn-label');
  dot.className=currentTurn;
  if(gameOver){label.textContent=winner===RED?'红方胜利！':'黑方胜利！';label.style.color=winner===RED?'#e74c3c':'#a0b0c0';}
  else{label.textContent=currentTurn===RED?'红方走棋':'黑方走棋';label.style.color='#fff';}
}

function handlePieceClick(row,col){
  if(gameOver||animating)return;
  const piece=board[row][col];
  if(selectedPos&&selectedPos.row===row&&selectedPos.col===col){deselectPiece();return;}
  if(piece&&piece.color===currentTurn){selectPiece(row,col);return;}
  if(selectedPos&&piece&&piece.color!==currentTurn){
    const move=legalMoves.find(m=>m.row===row&&m.col===col);
    if(move&&move.isCapture){doMove(row,col);return;}
  }
  if(selectedPos)deselectPiece();
}

function handleHintClick(row,col){if(!gameOver&&!animating)doMove(row,col);}

function selectPiece(row,col){selectedPos={row,col};legalMoves=getLegalMoves(row,col);renderAll();}

function deselectPiece(){selectedPos=null;legalMoves=[];renderAll();}

function doMove(toR,toC){
  if(!selectedPos||animating)return;
  const fromR=selectedPos.row,fromC=selectedPos.col;
  const wasCapture=board[toR][toC]!==null;
  const pieceEl=piecesLayer.querySelector('.piece.selected');
  selectedPos=null;legalMoves=[];hintsLayer.innerHTML='';updateTurnUI();
  if(!pieceEl){executeMove(fromR,fromC,toR,toC);renderAll();playMoveSound();if(wasCapture){showCaptureToast();setTimeout(()=>spawnFireRing(tx,ty),750);}if(gameOver)showVictory();return;}
  pieceEl.classList.remove('selected');
  const{cell,pad}=getBoardMetrics();
  const fx=pad+fromC*cell,fy=pad+fromR*cell,tx=pad+toC*cell,ty=pad+toR*cell;
  animating=true;
  const dur=180,start=performance.now();
  function step(now){
    const t=Math.min((now-start)/dur,1),ease=1-Math.pow(1-t,3);
    pieceEl.style.left=(fx+(tx-fx)*ease)+'px';pieceEl.style.top=(fy+(ty-fy)*ease)+'px';
    if(t<1){requestAnimationFrame(step);}
    else{
      if(wasCapture)spawnSparks(tx,ty);
      setTimeout(()=>{animating=false;executeMove(fromR,fromC,toR,toC);renderAll();playMoveSound();if(wasCapture){showCaptureToast();setTimeout(()=>spawnFireRing(tx,ty),750);}if(!gameOver&&isInCheck(board,currentTurn)){if(wasCapture){setTimeout(()=>showCheckToast(),650);}else{showCheckToast();}}if(gameOver)showVictory();},wasCapture?220:60);
    }
  }
  requestAnimationFrame(step);
}

function spawnSparks(x,y){
  const colors=['#ff4444','#ff8800','#ffdd00','#ffffff','#ff6644'];
  const count=18,wrapper=document.getElementById('board-wrapper');
  for(let i=0;i<count;i++){
    const spark=document.createElement('div');
    spark.className='spark-particle';
    const angle=(i/count)*Math.PI*2+Math.random()*0.4;
    const dist=25+Math.random()*35;
    spark.style.cssText='position:absolute;width:5px;height:5px;border-radius:50%;background:'+colors[Math.floor(Math.random()*colors.length)]+';left:'+x+'px;top:'+y+'px;pointer-events:none;z-index:25;';
    wrapper.appendChild(spark);
    const dx=Math.cos(angle)*dist,dy=Math.sin(angle)*dist;
    const anim=spark.animate([
      {transform:'translate(-50%,-50%) scale(0)',opacity:1},
      {transform:'translate(calc(-50% + '+(dx*0.4).toFixed(1)+'px), calc(-50% + '+(dy*0.4).toFixed(1)+'px)) scale(1.8)',opacity:0.9,offset:0.35},
      {transform:'translate(calc(-50% + '+dx.toFixed(1)+'px), calc(-50% + '+dy.toFixed(1)+'px)) scale(0.2)',opacity:0}
    ],{duration:600+Math.random()*300,easing:'ease-out',fill:'forwards'});
    anim.addEventListener('finish',()=>spark.remove(),{once:true});
  }
}
let audioCtx=null;
function playMoveSound(){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const t=audioCtx.currentTime;
    const dur=0.08;
    const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*dur,audioCtx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<data.length;i++){
      const env=Math.exp(-i/(audioCtx.sampleRate*0.008));
      data[i]=(Math.random()*2-1)*env*0.5;
    }
    const src=audioCtx.createBufferSource();src.buffer=buf;
    const bp=audioCtx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=800;bp.Q.value=1.5;
    const gain=audioCtx.createGain();gain.gain.setValueAtTime(0.6,t);gain.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(bp);bp.connect(gain);gain.connect(audioCtx.destination);
    src.start(t);src.stop(t+dur);
  }catch(e){}
}

function spawnFireRing(x,y){
  const wrapper=document.getElementById('board-wrapper');
  const{cell}=getBoardMetrics();
  const r=cell*0.5;
  const ring=document.createElement('div');ring.className='fire-ring';
  ring.style.cssText='left:'+x+'px;top:'+y+'px;width:'+(r*2)+'px;height:'+(r*2)+'px;z-index:12;';
  wrapper.appendChild(ring);
  ring.animate([{opacity:0.85},{opacity:0}],{duration:60000,fill:'forwards',easing:'linear'}).addEventListener('finish',()=>ring.remove(),{once:true});
}

function speak(text,delay){
  try{
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";u.rate=0.85;u.pitch=1.1;u.volume=0.9;
      speechSynthesis.speak(u);
    },delay||0);
  }catch(e){}
}

function showCaptureToast(){
  const toast=document.getElementById('capture-toast');
  toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show');
  speak('吃');
}

function showCheckToast(){
  const toast=document.getElementById('check-toast');
  toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show');
  speak('将军');
}

function showVictory(){
  const overlay=document.getElementById('victory-overlay');
  const title=document.getElementById('victory-title');
  const subtitle=document.getElementById('victory-subtitle');
  title.textContent=winner===RED?'红方胜利！':'黑方胜利！';
  title.className=winner===RED?'red-win':'black-win';
  subtitle.textContent='共 '+moveHistory.length+' 步';
  overlay.classList.add('show');
}

function newGame(){
  initBoard();currentTurn=RED;selectedPos=null;legalMoves=[];moveHistory=[];gameOver=false;winner=null;animating=false;
  replayStepIdx=-1;highlightedMoveIdx=-1;
  document.getElementById('victory-overlay').classList.remove('show');
  document.getElementById('replay-panel').classList.remove('show');
  document.getElementById('capture-toast').classList.remove('show');
  document.getElementById('board-wrapper').querySelectorAll('.fire-ring,.spark-particle').forEach(el=>el.remove());
  document.getElementById('turn-label').style.color='#fff';
  renderAll();
}

function openReplay(){document.getElementById('replay-panel').classList.add('show');replayGoto(-1);}
function closeReplay(){document.getElementById('replay-panel').classList.remove('show');renderAll();}

function replayGoto(idx){
  if(idx===-1)idx=moveHistory.length;
  idx=Math.max(0,Math.min(idx,moveHistory.length));
  replayStepIdx=idx;highlightedMoveIdx=idx-1;
  const tb=Array.from({length:10},()=>Array(9).fill(null));
  const br=[CHARIOT,HORSE,ELEPHANT,ADVISOR,KING,ADVISOR,ELEPHANT,HORSE,CHARIOT];
  for(let c=0;c<9;c++)tb[0][c]=createPiece(br[c],BLACK);
  tb[2][1]=createPiece(CANNON,BLACK);tb[2][7]=createPiece(CANNON,BLACK);
  for(let c=0;c<9;c+=2)tb[3][c]=createPiece(PAWN,BLACK);
  for(let c=0;c<9;c+=2)tb[6][c]=createPiece(PAWN,RED);
  tb[7][1]=createPiece(CANNON,RED);tb[7][7]=createPiece(CANNON,RED);
  for(let c=0;c<9;c++)tb[9][c]=createPiece(br[c],RED);
  for(let i=0;i<idx;i++){const m=moveHistory[i];tb[m.to.row][m.to.col]=createPiece(m.piece.type,m.piece.color);tb[m.from.row][m.from.col]=null;}
  renderReplayBoard(tb);renderReplayMoves();updateReplayButtons();
}

function replayStep(delta){replayGoto(replayStepIdx+delta);}

function renderReplayBoard(tb){
  const panel=document.getElementById('replay-board-inner');
  drawBoard(replayCanvas,replayCtx);
  panel.querySelectorAll('.replay-piece,.replay-highlight').forEach(el=>el.remove());
  const cell=panel.clientWidth/9,pad=cell*0.5;
  for(let r=0;r<10;r++)for(let c=0;c<9;c++){
    const piece=tb[r][c];if(!piece)continue;
    const el=document.createElement('div');
    el.className='piece '+piece.color+'-piece replay-piece';
    el.textContent=PIECE_NAMES[piece.color][piece.type];
    el.style.cssText='position:absolute;left:'+(pad+c*cell)+'px;top:'+(pad+r*cell)+'px;pointer-events:none;';
    panel.appendChild(el);
  }
  if(highlightedMoveIdx>=0&&highlightedMoveIdx<moveHistory.length){
    const m=moveHistory[highlightedMoveIdx];
    const fx=pad+m.from.col*cell,fy=pad+m.from.row*cell,tx=pad+m.to.col*cell,ty=pad+m.to.row*cell;
    for(const[x,y]of[[fx,fy],[tx,ty]]){
      const dot=document.createElement('div');dot.className='replay-highlight';
      dot.style.cssText='position:absolute;width:'+(cell*0.3)+'px;height:'+(cell*0.3)+'px;border-radius:50%;background:rgba(255,215,0,0.8);left:'+x+'px;top:'+y+'px;transform:translate(-50%,-50%);pointer-events:none;';
      panel.appendChild(dot);
    }
    const dx=tx-fx,dy=ty-fy,len=Math.sqrt(dx*dx+dy*dy),angle=Math.atan2(dy,dx)*180/Math.PI;
    const arrow=document.createElement('div');arrow.className='replay-highlight';
    arrow.style.cssText='position:absolute;height:3px;background:rgba(255,215,0,0.5);left:'+fx+'px;top:'+fy+'px;width:'+len+'px;transform-origin:0 50%;transform:rotate('+angle+'deg);pointer-events:none;';
    panel.appendChild(arrow);
  }
}

function renderReplayMoves(){
  const container=document.getElementById('replay-moves');container.innerHTML='';
  for(let i=0;i<moveHistory.length;i++){
    const m=moveHistory[i],el=document.createElement('div');el.className='replay-move';
    if(i===highlightedMoveIdx)el.classList.add('current');
    if(m.captured)el.classList.add('capture');
    const cl=m.turn===RED?'红':'黑',pn=PIECE_NAMES[m.piece.color][m.piece.type];
    const cs=m.captured?' 吃！':'';
    el.textContent=(i+1)+'. '+cl+pn+' '+m.from.col+(9-m.from.row)+'→'+m.to.col+(9-m.to.row)+cs;
    ((ix)=>{el.addEventListener('click',()=>replayGoto(ix+1));})(i);
    container.appendChild(el);
  }
  if(highlightedMoveIdx>=0){const cur=container.children[highlightedMoveIdx];if(cur)cur.scrollIntoView({block:'nearest',behavior:'smooth'});}
}

function updateReplayButtons(){
  document.getElementById('replay-prev').disabled=replayStepIdx<=0;
  document.getElementById('replay-next').disabled=replayStepIdx>=moveHistory.length;
  document.getElementById('replay-start').disabled=replayStepIdx<=0;
  document.getElementById('replay-end').disabled=replayStepIdx>=moveHistory.length;
}

document.getElementById('board-wrapper').addEventListener('click',function(e){if((e.target===this||e.target===boardCanvas)&&selectedPos)deselectPiece();});

function handleResize(){
  if(animating)return;
  drawBoard(boardCanvas,boardCtx);renderPieces();renderHints();
  if(document.getElementById('replay-panel').classList.contains('show'))replayGoto(replayStepIdx);
}

window.addEventListener('resize',handleResize);
newGame();
window.addEventListener('load',()=>setTimeout(handleResize,100));
if(window.ResizeObserver)new ResizeObserver(handleResize).observe(document.getElementById('board-wrapper'));
</script>
</body>
</html>
