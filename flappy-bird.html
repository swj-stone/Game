<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: "Segoe UI", "PingFang SC", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    max-height: 100vh;
    max-width: 100vw;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ============================================================
// FLAPPY BIRD
// ============================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 400, H = 600;
canvas.width = W;
canvas.height = H;

// ---- State ----
const STATE = { IDLE: 0, PLAYING: 1, OVER: 2 };
let state = STATE.IDLE;

// ---- Bird ----
const BIRD_X = 80, BIRD_R = 16;
const GRAVITY = 0.28, FLAP_VEL = -7.5, MAX_VEL = 10;
let birdY, birdVel, birdRot;

// ---- Pipes ----
const PIPE_W = 60, PIPE_GAP = 150, PIPE_SPACING = 210;
const BASE_SPEED = 2.0;
let pipes = [], pipeSpeed, frameCount;

// ---- Ground ----
const GROUND_H = 80;
let groundOffset;

// ---- Score ----
let score;
let best = parseInt(localStorage.getItem("flappy-best") || "0");

// ---- Particles ----
let particles = [];

function resetGame() {
  birdY = H / 2;
  birdVel = 0;
  birdRot = 0;
  pipes = [];
  pipeSpeed = BASE_SPEED;
  frameCount = 0;
  groundOffset = 0;
  score = 0;
  particles = [];
}

// ============================
// Audio (Web Audio API)
// ============================
let audioCtx = null;

function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e) {}
}

function playTone(freq, type, duration, vol, ramp) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (ramp) osc.frequency.linearRampToValueAtTime(ramp, t + duration);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + duration);
}

function sfxFlap()  { playTone(420, "square", 0.08, 0.12, 800); }
function sfxScore() { playTone(880, "sine", 0.1, 0.15); setTimeout(function(){ playTone(1320, "sine", 0.1, 0.12); }, 60); }
function sfxHit()   { playTone(80, "sawtooth", 0.2, 0.25, 30); }

// ============================
// Particles
// ============================
function spawnParticles(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    let angle = Math.random() * Math.PI * 2;
    let speed = 1 + Math.random() * 4;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.015 + Math.random() * 0.03,
      r: 2 + Math.random() * 4,
      color: color
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    let p = particles[i];
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================
// Drawing
// ============================

function drawSky() {
  let grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  grad.addColorStop(0, "#4dc9f6");
  grad.addColorStop(0.6, "#a8e6cf");
  grad.addColorStop(1, "#dcedc1");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H - GROUND_H);

  ctx.fillStyle = "rgba(255,255,255,0.7)";
  drawCloud(60  + ((frameCount * 0.3) % (W + 120)) - 60, 80, 1);
  drawCloud(220 + ((frameCount * 0.2) % (W + 120)) - 60, 140, 0.7);
  drawCloud(340 + ((frameCount * 0.35) % (W + 120)) - 60, 50, 0.8);
}

function drawCloud(x, y, scale) {
  ctx.beginPath();
  ctx.arc(x, y, 25 * scale, 0, Math.PI * 2);
  ctx.arc(x + 30 * scale, y - 15 * scale, 20 * scale, 0, Math.PI * 2);
  ctx.arc(x + 55 * scale, y, 22 * scale, 0, Math.PI * 2);
  ctx.arc(x + 20 * scale, y + 5 * scale, 18 * scale, 0, Math.PI * 2);
  ctx.fill();
}

function drawPipe(pipe) {
  let x = pipe.x, gapY = pipe.gapY;
  let capH = 25, capExtra = 5;

  let topH = gapY - PIPE_GAP / 2;
  let botY = gapY + PIPE_GAP / 2;

  // body gradient (top)
  let bgt = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
  bgt.addColorStop(0, "#558b2f");
  bgt.addColorStop(0.3, "#7cb342");
  bgt.addColorStop(0.7, "#8bc34a");
  bgt.addColorStop(1, "#33691e");

  // body gradient (bottom)
  let bgb = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
  bgb.addColorStop(0, "#558b2f");
  bgb.addColorStop(0.3, "#7cb342");
  bgb.addColorStop(0.7, "#8bc34a");
  bgb.addColorStop(1, "#33691e");

  // cap gradient
  let cg = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
  cg.addColorStop(0, "#33691e");
  cg.addColorStop(0.3, "#689f38");
  cg.addColorStop(0.7, "#7cb342");
  cg.addColorStop(1, "#255d00");

  // top pipe body
  ctx.fillStyle = bgt;
  ctx.fillRect(x, 0, PIPE_W, topH - capH);
  // top pipe cap
  ctx.fillStyle = cg;
  ctx.fillRect(x - capExtra, topH - capH, PIPE_W + capExtra * 2, capH);

  // bottom pipe cap
  ctx.fillStyle = cg;
  ctx.fillRect(x - capExtra, botY, PIPE_W + capExtra * 2, capH);
  // bottom pipe body
  ctx.fillStyle = bgb;
  ctx.fillRect(x, botY + capH, PIPE_W, H - GROUND_H - botY - capH);
}

function drawBird(y, rot) {
  ctx.save();
  ctx.translate(BIRD_X, y);
  ctx.rotate(rot);

  let wingPhase = Math.sin(frameCount * 0.25) * 0.6;

  // body
  let bg = ctx.createRadialGradient(-3, -2, 2, 0, 0, BIRD_R);
  bg.addColorStop(0, "#FFD54F");
  bg.addColorStop(0.6, "#FFB300");
  bg.addColorStop(1, "#F57C00");
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
  ctx.fill();

  // belly
  ctx.fillStyle = "#FFF9C4";
  ctx.beginPath();
  ctx.ellipse(-3, 5, 9, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  // wing
  ctx.fillStyle = "#FF8F00";
  ctx.beginPath();
  ctx.ellipse(-2, wingPhase * 10 - 2, 10, 7, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // eye white
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(5, -5, 7, 0, Math.PI * 2);
  ctx.fill();

  // pupil
  ctx.fillStyle = "#212121";
  ctx.beginPath();
  ctx.arc(7, -5, 3.5, 0, Math.PI * 2);
  ctx.fill();

  // highlight
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(8.5, -6.5, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // beak
  ctx.fillStyle = "#E53935";
  ctx.beginPath();
  ctx.moveTo(12, -3);
  ctx.lineTo(22, -1);
  ctx.lineTo(12, 1);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawGround() {
  let gg = ctx.createLinearGradient(0, H - GROUND_H, 0, H);
  gg.addColorStop(0, "#689f38");
  gg.addColorStop(0.3, "#558b2f");
  gg.addColorStop(1, "#33691e");
  ctx.fillStyle = gg;
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);

  // grass tufts
  ctx.strokeStyle = "#7cb342";
  ctx.lineWidth = 2;
  for (let x = -groundOffset % 40; x < W; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, H - GROUND_H);
    ctx.lineTo(x - 5, H - GROUND_H - 8);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 15, H - GROUND_H);
    ctx.lineTo(x + 12, H - GROUND_H - 6);
    ctx.stroke();
  }

  ctx.fillStyle = "#8bc34a";
  ctx.fillRect(0, H - GROUND_H, W, 5);
}

function drawScore() {
  ctx.fillStyle = "#fff";
  ctx.font = "bold 48px Segoe UI, PingFang SC, sans-serif";
  ctx.textAlign = "center";
  ctx.shadowColor = "rgba(0,0,0,0.4)";
  ctx.shadowBlur = 8;
  ctx.fillText(score, W / 2, 70);
  ctx.shadowBlur = 0;

  if (best > 0) {
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.font = "14px Segoe UI, PingFang SC, sans-serif";
    ctx.fillText("Highest: " + best, W / 2, 95);
  }
}

function drawIdleHint() {
  let alpha = 0.5 + Math.sin(frameCount * 0.05) * 0.5;
  ctx.fillStyle = "rgba(255,255,255," + alpha + ")";
  ctx.font = "bold 22px Segoe UI, PingFang SC, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Tap or Press Space", W / 2, H / 2 + 100);

  ctx.font = "14px Segoe UI, PingFang SC, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText("Dodge pipes - Fly far!", W / 2, H / 2 + 130);
}

function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(0, 0, W, H);

  let px = W / 2 - 130, py = H / 2 - 90;

  // panel
  ctx.fillStyle = "#DED895";
  ctx.strokeStyle = "#8B7355";
  ctx.lineWidth = 3;
  roundRect(px, py, 260, 180, 12, true, true);

  // title
  ctx.fillStyle = "#5D4037";
  ctx.font = "bold 28px Segoe UI, PingFang SC, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Game Over", W / 2, py + 42);

  // score
  ctx.fillStyle = "#3E2723";
  ctx.font = "18px Segoe UI, PingFang SC, sans-serif";
  ctx.fillText("Score: " + score, W / 2, py + 80);

  // best / new record
  if (score >= best && score > 0) {
    ctx.fillStyle = "#E53935";
    ctx.font = "bold 16px Segoe UI, PingFang SC, sans-serif";
    ctx.fillText("[New Record!]", W / 2, py + 105);
  } else {
    ctx.fillStyle = "#5D4037";
    ctx.font = "14px Segoe UI, PingFang SC, sans-serif";
    ctx.fillText("Best: " + best, W / 2, py + 105);
  }

  // medal
  let mc = score >= 40 ? "#FFD700" : score >= 20 ? "#C0C0C0" : score >= 10 ? "#CD7F32" : null;
  if (mc) {
    ctx.fillStyle = mc;
    ctx.beginPath();
    ctx.arc(px + 210, py + 30, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px Segoe UI, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(score >= 40 ? "G" : score >= 20 ? "S" : "B", px + 210, py + 36);
  }

  let a2 = 0.5 + Math.sin(frameCount * 0.06) * 0.5;
  ctx.fillStyle = "rgba(93,64,55," + a2 + ")";
  ctx.font = "16px Segoe UI, PingFang SC, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Tap to Retry", W / 2, py + 150);
}

function roundRect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

// ============================
// Game Logic
// ============================

function spawnPipe() {
  let minGap = 80, maxGap = H - GROUND_H - 80;
  let gapY = minGap + Math.random() * (maxGap - minGap);
  pipes.push({ x: W + 20, gapY: gapY, scored: false });
}

function updatePhysics() {
  birdVel += GRAVITY;
  if (birdVel > MAX_VEL) birdVel = MAX_VEL;
  birdY += birdVel;
  birdRot = Math.min(Math.max(birdVel * 0.08, -0.5), 1.2);
}

function updatePipes() {
  for (let i = pipes.length - 1; i >= 0; i--) {
    pipes[i].x -= pipeSpeed;

    if (!pipes[i].scored && pipes[i].x + PIPE_W < BIRD_X) {
      pipes[i].scored = true;
      score++;
      sfxScore();
      pipeSpeed = BASE_SPEED + score * 0.05;
      spawnParticles(BIRD_X, birdY, 10, "#FFD54F");
    }

    if (pipes[i].x < -PIPE_W - 20) {
      pipes.splice(i, 1);
    }
  }

  if (pipes.length === 0 || pipes[pipes.length - 1].x < W - PIPE_SPACING) {
    if (pipes.length < 4) spawnPipe();
  }
}

function checkCollision() {
  let bx = BIRD_X - BIRD_R + 4;
  let by = birdY - BIRD_R + 4;
  let bw = BIRD_R * 2 - 8;
  let bh = BIRD_R * 2 - 8;

  if (birdY - BIRD_R <= 0 || birdY + BIRD_R >= H - GROUND_H) return true;

  for (let i = 0; i < pipes.length; i++) {
    let p = pipes[i];
    let topH = p.gapY - PIPE_GAP / 2;
    let botY = p.gapY + PIPE_GAP / 2;

    if (bx + bw > p.x && bx < p.x + PIPE_W) {
      if (by < topH || by + bh > botY) return true;
    }
  }
  return false;
}

function handleGameOver() {
  state = STATE.OVER;
  sfxHit();
  spawnParticles(BIRD_X, birdY, 20, "#FF6F00");
  spawnParticles(BIRD_X, birdY, 15, "#F44336");

  if (score > best) {
    best = score;
    localStorage.setItem("flappy-best", best);
  }
}

function flap() {
  initAudio();
  birdVel = FLAP_VEL;
  sfxFlap();
  spawnParticles(BIRD_X, birdY + 10, 5, "#FFF9C4");
}

// ============================
// Main Loop
// ============================

function update() {
  frameCount++;

  switch (state) {
    case STATE.IDLE:
      birdY = H / 2 + Math.sin(frameCount * 0.04) * 12;
      birdRot = Math.sin(frameCount * 0.04) * 0.1;
      groundOffset += 1;
      updateParticles();
      break;

    case STATE.PLAYING:
      updatePhysics();
      updatePipes();
      groundOffset += pipeSpeed;
      updateParticles();
      if (checkCollision()) handleGameOver();
      break;

    case STATE.OVER:
      groundOffset += 0.5;
      updateParticles();
      if (birdY + BIRD_R < H - GROUND_H) {
        birdVel += GRAVITY;
        birdY += birdVel;
        birdRot = Math.min(birdRot + 0.05, 1.5);
      }
      break;
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawSky();
  for (let i = 0; i < pipes.length; i++) drawPipe(pipes[i]);
  drawGround();
  drawBird(birdY, birdRot);
  drawParticles();
  drawScore();
  if (state === STATE.IDLE) drawIdleHint();
  if (state === STATE.OVER) drawGameOver();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ============================
// Input
// ============================

function handleInput() {
  switch (state) {
    case STATE.IDLE:
      state = STATE.PLAYING;
      flap();
      break;
    case STATE.PLAYING:
      flap();
      break;
    case STATE.OVER:
      resetGame();
      state = STATE.PLAYING;
      flap();
      break;
  }
}

canvas.addEventListener("click", function(e) { e.preventDefault(); handleInput(); });
canvas.addEventListener("touchstart", function(e) { e.preventDefault(); handleInput(); });
document.addEventListener("keydown", function(e) {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
    e.preventDefault();
    handleInput();
  }
});
document.addEventListener("dblclick", function(e) { e.preventDefault(); });

// ============================
// Start
// ============================
resetGame();
gameLoop();
</script>
</body>
</html>
