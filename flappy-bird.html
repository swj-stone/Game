<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: "Segoe UI", "PingFang SC", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    max-height: 100vh;
    max-width: 100vw;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ============================================================
// FLAPPY BIRD
// ============================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 400, H = 600;
canvas.width = W;
canvas.height = H;

// ---- State Machine ----
const STATE = { MENU: 0, COUNTDOWN: 1, PLAYING: 2, OVER: 3 };
let state = STATE.MENU;

// ---- Difficulty Configs ----
const DIFFICULTY = {
  easy:   { label: "Easy",   baseSpeed: 1.5, pipeGap: 190, pipeSpacing: 460, gravity: 0.14, flapVel: -3.75, color: "#66BB6A" },
  normal: { label: "Normal", baseSpeed: 2.0, pipeGap: 170, pipeSpacing: 420, gravity: 0.21, flapVel: -3.75, color: "#FFA726" },
  hard:   { label: "Hard",   baseSpeed: 2.8, pipeGap: 140, pipeSpacing: 360, gravity: 0.28, flapVel: -7.5, color: "#EF5350" }
};
let difficulty = "normal"; // default
function diff() { return DIFFICULTY[difficulty]; }

// ---- Bird ----
const BIRD_X = 80, BIRD_R = 16;
const MAX_VEL = 10;
let birdY, birdVel, birdRot;

// ---- Pipes ----
const PIPE_W = 60;
let pipes = [], pipeSpeed, frameCount;

// ---- Ground ----
const GROUND_H = 80;
let groundOffset;

// ---- Score ----
let score;
let best = parseInt(localStorage.getItem("flappy-best") || "0");

// ---- Particles ----
let particles = [];

// ---- Countdown ----
let countdownValue, countdownTimer;

// ---- Mouse ----
let mouseX = -100, mouseY = -100;

// ---- Button hover animation state ----
let hoverState = {}; // { buttonKey: { scale, targetScale } }

function resetHover() {
  hoverState = {};
}

function resetGame() {
  birdY = H / 2;
  birdVel = 0;
  birdRot = 0;
  pipes = [];
  pipeSpeed = diff().baseSpeed;
  frameCount = 0;
  groundOffset = 0;
  score = 0;
  particles = [];
  countdownValue = 0;
  countdownTimer = 0;
}

// ============================
// Audio (Web Audio API)
// ============================
let audioCtx = null;

function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e) {}
}

function playTone(freq, type, duration, vol, ramp) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (ramp) osc.frequency.linearRampToValueAtTime(ramp, t + duration);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + duration);
}

function sfxFlap()  { playTone(420, "square", 0.08, 0.12, 800); }
function sfxScore() { playTone(880, "sine", 0.1, 0.15); setTimeout(function(){ playTone(1320, "sine", 0.1, 0.12); }, 60); }
function sfxHit()   { playTone(80, "sawtooth", 0.2, 0.25, 30); }
function sfxSelect(){ playTone(600, "sine", 0.06, 0.08, 1000); }
function sfxCount() { playTone(440, "square", 0.15, 0.15); }
function sfxGo()    { playTone(880, "square", 0.2, 0.2, 1200); }

// ============================
// Button helper - detects hover
// ============================
function isInRect(mx, my, x, y, w, h) {
  return mx >= x && mx <= x + w && my >= y && my <= y + h;
}

// Button definitions (positioned dynamically in drawMenu)
function getMenuButtons() {
  var cy = 290;
  var bw = 80, bh = 40, gap = 16;
  var totalW = bw * 3 + gap * 2;
  var sx = (W - totalW) / 2;
  var btns = [];
  var keys = ["easy", "normal", "hard"];
  for (var i = 0; i < 3; i++) {
    btns.push({ key: "diff_" + keys[i], x: sx + i * (bw + gap), y: cy, w: bw, h: bh });
  }
  // Start button
  btns.push({ key: "start", x: W / 2 - 70, y: cy + 80, w: 140, h: 50 });
  return btns;
}

// ============================
// Particles
// ============================
function spawnParticles(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    let angle = Math.random() * Math.PI * 2;
    let speed = 1 + Math.random() * 4;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.015 + Math.random() * 0.03,
      r: 2 + Math.random() * 4,
      color: color
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    let p = particles[i];
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================
// Drawing
// ============================

function drawSky() {
  let grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  grad.addColorStop(0, "#4dc9f6");
  grad.addColorStop(0.6, "#a8e6cf");
  grad.addColorStop(1, "#dcedc1");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H - GROUND_H);

  ctx.fillStyle = "rgba(255,255,255,0.7)";
  drawCloud(60  + ((frameCount * 0.3) % (W + 120)) - 60, 80, 1);
  drawCloud(220 + ((frameCount * 0.2) % (W + 120)) - 60, 140, 0.7);
  drawCloud(340 + ((frameCount * 0.35) % (W + 120)) - 60, 50, 0.8);
}

function drawCloud(x, y, scale) {
  ctx.beginPath();
  ctx.arc(x, y, 25 * scale, 0, Math.PI * 2);
  ctx.arc(x + 30 * scale, y - 15 * scale, 20 * scale, 0, Math.PI * 2);
  ctx.arc(x + 55 * scale, y, 22 * scale, 0, Math.PI * 2);
  ctx.arc(x + 20 * scale, y + 5 * scale, 18 * scale, 0, Math.PI * 2);
  ctx.fill();
}

function drawPipe(pipe) {
  let x = pipe.x, gapY = pipe.gapY;
  let capH = 25, capExtra = 5;
  let gap = diff().pipeGap;

  let topH = gapY - gap / 2;
  let botY = gapY + gap / 2;

  let bgt = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
  bgt.addColorStop(0, "#558b2f");
  bgt.addColorStop(0.3, "#7cb342");
  bgt.addColorStop(0.7, "#8bc34a");
  bgt.addColorStop(1, "#33691e");

  let bgb = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
  bgb.addColorStop(0, "#558b2f");
  bgb.addColorStop(0.3, "#7cb342");
  bgb.addColorStop(0.7, "#8bc34a");
  bgb.addColorStop(1, "#33691e");

  let cg = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
  cg.addColorStop(0, "#33691e");
  cg.addColorStop(0.3, "#689f38");
  cg.addColorStop(0.7, "#7cb342");
  cg.addColorStop(1, "#255d00");

  ctx.fillStyle = bgt;
  ctx.fillRect(x, 0, PIPE_W, topH - capH);
  ctx.fillStyle = cg;
  ctx.fillRect(x - capExtra, topH - capH, PIPE_W + capExtra * 2, capH);

  ctx.fillStyle = cg;
  ctx.fillRect(x - capExtra, botY, PIPE_W + capExtra * 2, capH);
  ctx.fillStyle = bgb;
  ctx.fillRect(x, botY + capH, PIPE_W, H - GROUND_H - botY - capH);
}

function drawBird(y, rot) {
  ctx.save();
  ctx.translate(BIRD_X, y);
  ctx.rotate(rot);

  let wingPhase = Math.sin(frameCount * 0.25) * 0.6;

  let bg = ctx.createRadialGradient(-3, -2, 2, 0, 0, BIRD_R);
  bg.addColorStop(0, "#FFD54F");
  bg.addColorStop(0.6, "#FFB300");
  bg.addColorStop(1, "#F57C00");
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#FFF9C4";
  ctx.beginPath();
  ctx.ellipse(-3, 5, 9, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#FF8F00";
  ctx.beginPath();
  ctx.ellipse(-2, wingPhase * 10 - 2, 10, 7, -0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(5, -5, 7, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#212121";
  ctx.beginPath();
  ctx.arc(7, -5, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(8.5, -6.5, 1.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#E53935";
  ctx.beginPath();
  ctx.moveTo(12, -3);
  ctx.lineTo(22, -1);
  ctx.lineTo(12, 1);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawGround() {
  let gg = ctx.createLinearGradient(0, H - GROUND_H, 0, H);
  gg.addColorStop(0, "#689f38");
  gg.addColorStop(0.3, "#558b2f");
  gg.addColorStop(1, "#33691e");
  ctx.fillStyle = gg;
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);

  ctx.strokeStyle = "#7cb342";
  ctx.lineWidth = 2;
  for (let x = -groundOffset % 40; x < W; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, H - GROUND_H);
    ctx.lineTo(x - 5, H - GROUND_H - 8);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 15, H - GROUND_H);
    ctx.lineTo(x + 12, H - GROUND_H - 6);
    ctx.stroke();
  }

  ctx.fillStyle = "#8bc34a";
  ctx.fillRect(0, H - GROUND_H, W, 5);
}

function drawScore() {
  ctx.fillStyle = "#fff";
  ctx.font = "bold 48px Segoe UI, PingFang SC, sans-serif";
  ctx.textAlign = "center";
  ctx.shadowColor = "rgba(0,0,0,0.4)";
  ctx.shadowBlur = 8;
  ctx.fillText(score, W / 2, 70);
  ctx.shadowBlur = 0;

  if (best > 0) {
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.font = "14px Segoe UI, PingFang SC, sans-serif";
    ctx.fillText("Highest: " + best, W / 2, 95);
  }
}

// ============================
// Menu Screen
// ============================

function drawMenu() {
  // Dimmed background
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = "#fff";
  ctx.font = "bold 42px Segoe UI, PingFang SC, sans-serif";
  ctx.textAlign = "center";
  ctx.shadowColor = "rgba(0,0,0,0.5)";
  ctx.shadowBlur = 10;
  ctx.fillText("Flappy Bird", W / 2, 150);
  ctx.shadowBlur = 0;

  // Subtitle
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.font = "16px Segoe UI, PingFang SC, sans-serif";
  ctx.fillText("Select Difficulty", W / 2, 240);

  var btns = getMenuButtons();

  // Draw difficulty buttons
  var keys = ["easy", "normal", "hard"];
  for (var i = 0; i < 3; i++) {
    var b = btns[i];
    var cfg = DIFFICULTY[keys[i]];
    var selected = (difficulty === keys[i]);
    drawMenuButton(b, cfg.label, cfg.color, selected);
  }

  // Draw start button
  var startBtn = btns[3];
  drawMenuButton(startBtn, "Start Game", "#42A5F5", false);

  // Best score
  if (best > 0) {
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.font = "14px Segoe UI, PingFang SC, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Best: " + best, W / 2, 440);
  }

  // Footer
  ctx.fillStyle = "rgba(255,255,255,0.4)";
  ctx.font = "12px Segoe UI, PingFang SC, sans-serif";
  ctx.fillText("Click or press Space to start", W / 2, 520);
}

function drawMenuButton(btn, label, accentColor, selected) {
  var hs = hoverState[btn.key];
  var scale = hs ? hs.scale : 1.0;
  var bounceY = (scale - 1) * btn.h * 0.5;

  ctx.save();
  ctx.translate(btn.x + btn.w / 2, btn.y + btn.h / 2);
  ctx.scale(scale, scale);

  var hw = btn.w / 2, hh = btn.h / 2;

  // Glow when selected
  if (selected) {
    ctx.shadowColor = accentColor;
    ctx.shadowBlur = 12;
  }

  // Button background
  var bgAlpha = selected ? 1 : 0.75;
  ctx.fillStyle = accentColor.replace(")", ", " + bgAlpha + ")").replace("rgb", "rgba");
  if (accentColor.startsWith("#")) {
    // Convert hex to rgba
    var r = parseInt(accentColor.slice(1,3), 16);
    var g = parseInt(accentColor.slice(3,5), 16);
    var b = parseInt(accentColor.slice(5,7), 16);
    ctx.fillStyle = "rgba(" + r + "," + g + "," + b + "," + bgAlpha + ")";
  }
  roundRect(-hw, -hh, btn.w, btn.h, 10, true, false);

  // Border
  if (selected) {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2.5;
    roundRect(-hw, -hh, btn.w, btn.h, 10, false, true);
  }

  ctx.shadowBlur = 0;

  // Label
  ctx.fillStyle = "#fff";
  ctx.font = (btn.key === "start" ? "bold 22px" : "bold 15px") + " Segoe UI, PingFang SC, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, 0, 1);

  // Selected indicator dot
  if (selected && btn.key !== "start") {
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(0, hh - 8, 4, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

// ============================
// Countdown Screen
// ============================

function drawCountdown() {
  // Dim
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fillRect(0, 0, W, H);

  var text, color, scale;
  if (countdownValue > 0) {
    text = "" + countdownValue;
    color = "#fff";
    scale = 1 + Math.sin(countdownTimer * 0.3) * 0.12;
  } else {
    text = "GO!";
    color = "#FFD54F";
    scale = 1.3;
  }

  ctx.save();
  ctx.translate(W/2, H/2 - 40);
  ctx.scale(scale, scale);

  ctx.fillStyle = color;
  ctx.font = "bold 80px Segoe UI, PingFang SC, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,0.5)";
  ctx.shadowBlur = 20;
  ctx.fillText(text, 0, 0);
  ctx.shadowBlur = 0;

  ctx.restore();
}

// ============================
// Game Over Panel
// ============================

function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(0, 0, W, H);

  let px = W / 2 - 130, py = H / 2 - 100;

  ctx.fillStyle = "#DED895";
  ctx.strokeStyle = "#8B7355";
  ctx.lineWidth = 3;
  roundRect(px, py, 260, 200, 12, true, true);

  ctx.fillStyle = "#5D4037";
  ctx.font = "bold 28px Segoe UI, PingFang SC, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Game Over", W / 2, py + 42);

  ctx.fillStyle = "#3E2723";
  ctx.font = "18px Segoe UI, PingFang SC, sans-serif";
  ctx.fillText("Score: " + score, W / 2, py + 80);

  if (score >= best && score > 0) {
    ctx.fillStyle = "#E53935";
    ctx.font = "bold 16px Segoe UI, PingFang SC, sans-serif";
    ctx.fillText("[New Record!]", W / 2, py + 105);
  } else {
    ctx.fillStyle = "#5D4037";
    ctx.font = "14px Segoe UI, PingFang SC, sans-serif";
    ctx.fillText("Best: " + best, W / 2, py + 105);
  }

  let mc = score >= 40 ? "#FFD700" : score >= 20 ? "#C0C0C0" : score >= 10 ? "#CD7F32" : null;
  if (mc) {
    ctx.fillStyle = mc;
    ctx.beginPath();
    ctx.arc(px + 210, py + 30, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px Segoe UI, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(score >= 40 ? "G" : score >= 20 ? "S" : "B", px + 210, py + 36);
  }

  // Difficulty label
  ctx.fillStyle = "#8D6E63";
  ctx.font = "13px Segoe UI, PingFang SC, sans-serif";
  ctx.fillText("Difficulty: " + diff().label, W / 2, py + 125);

  let a2 = 0.5 + Math.sin(frameCount * 0.06) * 0.5;
  ctx.fillStyle = "rgba(93,64,55," + a2 + ")";
  ctx.font = "16px Segoe UI, PingFang SC, sans-serif";
  ctx.fillText("Tap to Menu", W / 2, py + 170);
}

function roundRect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

// ============================
// Game Logic
// ============================

function spawnPipe() {
  let gap = diff().pipeGap;
  let minGap = 80, maxGap = H - GROUND_H - 80;
  let gapY = minGap + Math.random() * (maxGap - minGap);
  pipes.push({ x: W + 20, gapY: gapY, scored: false });
}

function updatePhysics() {
  birdVel += diff().gravity;
  if (birdVel > MAX_VEL) birdVel = MAX_VEL;
  birdY += birdVel;
  birdRot = Math.min(Math.max(birdVel * 0.08, -0.5), 1.2);
}

function updatePipes() {
  let spacing = diff().pipeSpacing;
  for (let i = pipes.length - 1; i >= 0; i--) {
    pipes[i].x -= pipeSpeed;

    if (!pipes[i].scored && pipes[i].x + PIPE_W < BIRD_X) {
      pipes[i].scored = true;
      score++;
      sfxScore();
      pipeSpeed = diff().baseSpeed + score * 0.05;
      spawnParticles(BIRD_X, birdY, 10, "#FFD54F");
    }

    if (pipes[i].x < -PIPE_W - 20) {
      pipes.splice(i, 1);
    }
  }

  if (pipes.length === 0 || pipes[pipes.length - 1].x < W - spacing) {
    if (pipes.length < 4) spawnPipe();
  }
}

function checkCollision() {
  let bx = BIRD_X - BIRD_R + 4;
  let by = birdY - BIRD_R + 4;
  let bw = BIRD_R * 2 - 8;
  let bh = BIRD_R * 2 - 8;
  let gap = diff().pipeGap;

  if (birdY - BIRD_R <= 0 || birdY + BIRD_R >= H - GROUND_H) return true;

  for (let i = 0; i < pipes.length; i++) {
    let p = pipes[i];
    let topH = p.gapY - gap / 2;
    let botY = p.gapY + gap / 2;

    if (bx + bw > p.x && bx < p.x + PIPE_W) {
      if (by < topH || by + bh > botY) return true;
    }
  }
  return false;
}

function handleGameOver() {
  state = STATE.OVER;
  sfxHit();
  spawnParticles(BIRD_X, birdY, 20, "#FF6F00");
  spawnParticles(BIRD_X, birdY, 15, "#F44336");

  if (score > best) {
    best = score;
    localStorage.setItem("flappy-best", best);
  }
}

function flap() {
  initAudio();
  birdVel = diff().flapVel;
  sfxFlap();
  spawnParticles(BIRD_X, birdY + 10, 5, "#FFF9C4");
}

// ============================
// Hover Animation
// ============================

function updateHover() {
  var btns = getMenuButtons();
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    var hovered = isInRect(mouseX, mouseY, b.x, b.y, b.w, b.h);
    var hs = hoverState[b.key];

    if (hovered) {
      // Target: bounce to 1.12
      if (!hs) {
        hoverState[b.key] = { scale: 1.0, target: 1.12 };
        hs = hoverState[b.key];
      }
      hs.target = 1.12;
    } else {
      // Target: back to 1.0
      if (!hs) {
        hoverState[b.key] = { scale: 1.0, target: 1.0 };
        hs = hoverState[b.key];
      }
      hs.target = 1.0;
    }

    // Smooth lerp toward target, with bounce overshoot
    var diff = hs.target - hs.scale;
    if (Math.abs(diff) < 0.001) {
      hs.scale = hs.target;
    } else {
      // Spring-like: fast toward target
      hs.scale += diff * 0.25;
    }
  }
}

// ============================
// Main Loop
// ============================

function update() {
  frameCount++;

  if (state === STATE.MENU) {
    updateHover();
    birdY = H / 2 + Math.sin(frameCount * 0.04) * 12;
    birdRot = Math.sin(frameCount * 0.04) * 0.1;
    groundOffset += 1;
    updateParticles();
  }
  else if (state === STATE.COUNTDOWN) {
    updateHover();
    birdY = H / 2 + Math.sin(frameCount * 0.04) * 12;
    birdRot = Math.sin(frameCount * 0.04) * 0.1;
    groundOffset += 1;
    updateParticles();

    // Countdown logic (60fps, ~1 second per step)
    countdownTimer++;
    if (countdownTimer >= 60) {
      countdownTimer = 0;
      countdownValue--;
      if (countdownValue >= 1) {
        sfxCount();
      } else {
        // GO!
        sfxGo();
      }
      if (countdownValue < 0) {
        // Start game
        state = STATE.PLAYING;
        resetGame();
        resetHover();
        flap();
      }
    }
  }
  else if (state === STATE.PLAYING) {
    updatePhysics();
    updatePipes();
    groundOffset += pipeSpeed;
    updateParticles();
    if (checkCollision()) handleGameOver();
  }
  else if (state === STATE.OVER) {
    updateHover();
    groundOffset += 0.5;
    updateParticles();
    if (birdY + BIRD_R < H - GROUND_H) {
      birdVel += diff().gravity;
      birdY += birdVel;
      birdRot = Math.min(birdRot + 0.05, 1.5);
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawSky();
  for (let i = 0; i < pipes.length; i++) drawPipe(pipes[i]);
  drawGround();
  drawBird(birdY, birdRot);
  drawParticles();

  if (state === STATE.MENU) {
    drawMenu();
  } else if (state === STATE.COUNTDOWN) {
    drawCountdown();
  } else if (state === STATE.PLAYING || state === STATE.OVER) {
    drawScore();
  }

  if (state === STATE.OVER) {
    drawGameOver();
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ============================
// Input
// ============================

canvas.addEventListener("mousemove", function(e) {
  var rect = canvas.getBoundingClientRect();
  var scaleX = W / rect.width;
  var scaleY = H / rect.height;
  mouseX = (e.clientX - rect.left) * scaleX;
  mouseY = (e.clientY - rect.top) * scaleY;
});

canvas.addEventListener("mouseleave", function(e) {
  mouseX = -100;
  mouseY = -100;
});

canvas.addEventListener("click", function(e) {
  e.preventDefault();
  initAudio();

  if (state === STATE.MENU) {
    var mx = mouseX, my = mouseY;
    var btns = getMenuButtons();
    // Check difficulty buttons
    var keys = ["easy", "normal", "hard"];
    for (var i = 0; i < 3; i++) {
      var b = btns[i];
      if (isInRect(mx, my, b.x, b.y, b.w, b.h)) {
        difficulty = keys[i];
        sfxSelect();
        return;
      }
    }
    // Check start button
    var startBtn = btns[3];
    if (isInRect(mx, my, startBtn.x, startBtn.y, startBtn.w, startBtn.h)) {
      // Start countdown
      countdownValue = 3;
      countdownTimer = 0;
      state = STATE.COUNTDOWN;
      sfxCount();
      return;
    }
  }
  else if (state === STATE.PLAYING) {
    flap();
  }
  else if (state === STATE.OVER) {
    // Return to menu
    resetGame();
    resetHover();
    state = STATE.MENU;
    birdY = H / 2;
  }
});

canvas.addEventListener("touchstart", function(e) {
  e.preventDefault();
  // Use touch position for button detection
  if (e.touches.length > 0) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = W / rect.width;
    var scaleY = H / rect.height;
    mouseX = (e.touches[0].clientX - rect.left) * scaleX;
    mouseY = (e.touches[0].clientY - rect.top) * scaleY;
  }
  initAudio();

  if (state === STATE.MENU) {
    var mx = mouseX, my = mouseY;
    var btns = getMenuButtons();
    var keys = ["easy", "normal", "hard"];
    for (var i = 0; i < 3; i++) {
      var b = btns[i];
      if (isInRect(mx, my, b.x, b.y, b.w, b.h)) {
        difficulty = keys[i];
        sfxSelect();
        return;
      }
    }
    var startBtn = btns[3];
    if (isInRect(mx, my, startBtn.x, startBtn.y, startBtn.w, startBtn.h)) {
      countdownValue = 3;
      countdownTimer = 0;
      state = STATE.COUNTDOWN;
      sfxCount();
      return;
    }
  }
  else if (state === STATE.PLAYING) {
    flap();
  }
  else if (state === STATE.OVER) {
    resetGame();
    resetHover();
    state = STATE.MENU;
    birdY = H / 2;
  }
});

document.addEventListener("keydown", function(e) {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
    e.preventDefault();
    initAudio();
    if (state === STATE.MENU) {
      countdownValue = 3;
      countdownTimer = 0;
      state = STATE.COUNTDOWN;
      sfxCount();
    } else if (state === STATE.PLAYING) {
      flap();
    } else if (state === STATE.OVER) {
      resetGame();
      resetHover();
      state = STATE.MENU;
      birdY = H / 2;
    }
  }
});

document.addEventListener("dblclick", function(e) { e.preventDefault(); });

// ============================
// Start
// ============================
resetGame();
state = STATE.MENU;
birdY = H / 2;
gameLoop();
</script>
</body>
